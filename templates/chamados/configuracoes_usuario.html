<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações — TICS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'chamados/css/kanban.css' %}?v=4">
    <style>
        :root { --uc-header-bg:#ffffff; --uc-card-border:#e2e8f0; --uc-text:#1e2937; }
        body.dark-mode { --uc-header-bg:#1e2937; --uc-card-border:#334155; --uc-text:#e2e8f0; }
        body { transition: background .3s, color .3s; }
        .sidebar { background:#0f172a; min-height:100vh; width:210px; position:fixed; left:0; top:0; color:#cbd5e1; z-index:1000; transition:width .3s; border-right:1px solid rgba(255,255,255,.08); box-shadow:4px 0 10px rgba(0,0,0,.2); }
        .sidebar.collapsed { width:54px; }
        .main-content { margin-left:210px; transition:margin-left .3s; padding:58px 20px 20px; min-height:100vh; }
        .sidebar.collapsed ~ .main-content { margin-left:54px; }
        .top-header { background:var(--uc-header-bg); border-bottom:1px solid var(--uc-card-border); padding:8px 16px; position:fixed; top:0; left:210px; right:0; z-index:999; }
        .sidebar.collapsed ~ .top-header { left:54px; }
        body:not(.dark-mode) .top-header h4, body:not(.dark-mode) .top-header span { color:#1e2937; }
        .sidebar span { transition:opacity .2s,width .2s; overflow:hidden; white-space:nowrap; display:inline-block; }
        .sidebar.collapsed span { opacity:0; width:0; }
        .sidebar.collapsed .nav-link { justify-content:center; padding-left:0; padding-right:0; }
        .sidebar .nav-link { display:flex; align-items:center; gap:10px; }
        .sidebar .nav-link i { width:18px; text-align:center; flex-shrink:0; }
        .sidebar-logo { display:flex; align-items:center; gap:10px; font-size:1.1rem; font-weight:700; letter-spacing:.06em; color:#fff; }
        .sidebar-logo i { font-size:1.1rem; flex-shrink:0; }
        .sidebar.collapsed .px-4 { display:flex; justify-content:center; padding-left:0 !important; padding-right:0 !important; }
        .sidebar.collapsed .px-4 .sidebar-logo { font-size:0; gap:0; }
        .sidebar.collapsed .px-4 .sidebar-logo i { font-size:1.1rem; }
        .sidebar.collapsed .position-absolute.bottom-0 { padding-left:4px !important; padding-right:4px !important; }
        .sidebar.collapsed .position-absolute.bottom-0 .btn { padding-left:0; padding-right:0; display:flex; justify-content:center; }
        .sidebar .position-absolute.bottom-0 .btn { display:flex; align-items:center; justify-content:center; gap:8px; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="px-4 py-4">
            <div class="sidebar-logo"><i class="fas fa-headset"></i><span>TICS</span></div>
        </div>
        <ul class="nav flex-column mt-3 px-2">
            <li class="nav-item">
                <a href="{% url 'usuario_comum' %}" class="nav-link text-white">
                    <i class="fas fa-list-ul"></i><span>Meus Chamados</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'meus_agendamentos' %}" class="nav-link text-white">
                    <i class="fas fa-calendar-alt"></i><span>Agendar Multimídia</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'configuracoes_usuario' %}" class="nav-link text-white active">
                    <i class="fas fa-cog"></i><span>Configurações</span>
                </a>
            </li>
        </ul>
        <div class="position-absolute bottom-0 w-100 p-3 border-top border-secondary">
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm w-100">
                <i class="fas fa-right-from-bracket"></i><span>Sair</span>
            </a>
        </div>
    </div>

    <div class="top-header" id="topHeader">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <button id="sidebarToggle" class="btn btn-outline-secondary btn-sm"><i class="fas fa-bars"></i></button>
                <h4 class="mb-0 fw-bold" style="font-size:.95rem;">Configurações</h4>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span style="font-size:.82rem;">Olá, <strong>{{ user.get_full_name|default:user.username }}</strong></span>
                <button id="darkModeToggle" class="btn btn-outline-secondary btn-sm"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="row justify-content-center mt-4">
            <div class="col-md-6 text-center">
                <div class="card shadow-sm p-5">
                    <i class="fas fa-cog fa-3x text-muted mb-3"></i>
                    <h5 class="fw-bold">Configurações</h5>
                    <p class="text-muted small">Em desenvolvimento. Esta seção será expandida em versões futuras.</p>
                    <a href="{% url 'usuario_comum' %}" class="btn btn-outline-secondary btn-sm mt-2">
                        <i class="fas fa-arrow-left me-1"></i>Voltar
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'chamados/js/theme.js' %}"></script>
    <script src="{% static 'chamados/js/sidebar.js' %}?v=2"></script>
</body>
</html>
