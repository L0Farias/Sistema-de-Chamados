<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'chamados/css/login.css' %}">
</head>
<body>
    <div class="background-slider" id="slider">
        <img src="{% static 'chamados/images/bg1.jpg' %}" class="active" alt="TI">
        <img src="{% static 'chamados/images/bg2.jpg' %}" alt="TI">
        <img src="{% static 'chamados/images/bg3.jpg' %}" alt="TI">
        <img src="{% static 'chamados/images/bg4.jpg' %}" alt="TI">
        <img src="{% static 'chamados/images/bg5.jpg' %}" alt="TI">
    </div>

    <div class="container h-100">
        <div class="row h-100 justify-content-center align-items-center">
            <div class="col-lg-5">
                <div class="login-card p-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">Crie uma nova senha</h3>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100 btn-login mt-3">
                            Alterar Senha
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const images = document.querySelectorAll('#slider img');
        let current = 0;
        function changeImage() {
            images[current].classList.remove('active');
            current = (current + 1) % images.length;
            images[current].classList.add('active');
        }
        setInterval(changeImage, 6500);
    </script>
</body>
</html>
