<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Chamados TI</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'chamados/css/login.css' %}">
</head>
<body>

    <div class="background-slider" id="slider">
        <img src="{% static 'chamados/images/bg1.jpg' %}" class="active" alt="TI">
        <img src="{% static 'chamados/images/bg2.jpg' %}" alt="TI">
        <img src="{% static 'chamados/images/bg3.jpg' %}" alt="TI">
        <img src="{% static 'chamados/images/bg4.jpg' %}" alt="TI">
        <img src="{% static 'chamados/images/bg5.jpg' %}" alt="TI">
    </div>

    <div class="container h-100 py-3 py-md-4">
        <div class="row h-100 justify-content-center align-items-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="login-card p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">
                            <i class="fas fa-headset"></i> Sistema de Chamados TI
                        </h2>
                        <p class="text-muted">Entre com suas credenciais</p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 btn-login mt-3">
                            <i class="fas fa-sign-in-alt"></i> Entrar no Sistema
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{% url 'password_reset' %}" class="text-muted small">Esqueceu sua senha?</a>
                    </div>

                    <div class="text-center mt-3">
                        <a href="{% url 'cadastrar_comum' %}" class="text-decoration-none text-primary">
                            Não tem conta? Cadastre-se
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const images = document.querySelectorAll('#slider img');
        let current = 0;
        function changeImage() {
            images[current].classList.remove('active');
            current = (current + 1) % images.length;
            images[current].classList.add('active');
        }
        setInterval(changeImage, 6500);
    </script>
</body>
</html>
