<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Novo Chamado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-plus-circle"></i> Abrir Novo Chamado</h4>
                    </div>
                    <div class="card-body p-4">

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Local</label>
                                    {{ form.local }}
                                    <small class="text-muted">Ex: Sala 12, Setor Financeiro, Recepção</small>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Categoria</label>
                                    {{ form.categoria }}
                                    <small class="text-muted">Ex: Impressora, Rede, Computador, Software</small>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Tipo de Chamado</label>
                                {{ form.tipo }}
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Descreva o problema ou solicitação</label>
                                {{ form.problema }}
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="{% url 'usuario_comum' %}" class="btn btn-secondary me-md-2">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-paper-plane"></i> Abrir Chamado
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
